<!DOCTYPE html>

<script>
    window.onload = function(){
        let ancho = prompt("Introduce el ancho de la caja:");
        while (ancho != Number(ancho)){
            ancho = prompt("Introduce un número válido para el ancho:");
        }
        let alto = prompt("Introduce el alto de la caja:");
        while (alto != Number(alto)){
            alto = prompt("Introduce un número válido para el alto:");
        }
        let largo = prompt("Introduce el largo de la caja:");
        while (largo != Number(largo)){
            largo = prompt("Introduce un número válido para el largo:");
        }
        let volumen = ancho * alto * largo;
        alert("El volumen de la caja es: " + volumen);
    }
</script>
