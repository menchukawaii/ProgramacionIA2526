<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class User {
            constructor(nombre, apellido, email,rol){
                this.nombre = nombre;
                this.apellido = apellido;
                this.email = email;
                this.rol = rol;
                this.cursos = [];
                this.mensajes = []
            }

            addCurso(curso, nivel) {
                const cursoExistente = this.cursos.find(
                    c => c.curso == curso & c.nivel == nivel
                );
                if (!cursoExistente || cursoExistente == null){
                    this.cursos.push({
                        curso: curso,
                        nivel: nivel
                    });
                }
                else{
                    console.log("Error: El curso ya existe");
                }
            }

            removeCurso(curso, nivel){
                const index = this.cursos.findIndex(
                    c => c.curso == curso & c.nivel == nivel
                );
                if (index !== -1){
                    this.cursos.splice(index, 1);
                }
                else{
                    console.log("Error: El curso no existe");
                }
            }

            editCurso(curso, nivel){
                const index = this.cursos.findIndex(
                    c => c.curso == curso & c.nivel == nivel
                );
                if (index !== -1){
                    this.cursos[index].nivel = nivel
                }
                else{
                    console.log("Error: El curso ya existe");
                }
            }

            enviarMsg(from, to, mensaje){
                this.mensajes.push({from: from, to: to, mensaje: mensaje});
                console.log(`Mensaje enviado: From: ${from} To: ${to} Mensaje: ${mensaje}`);
            }
            
            mostrarMensajes(){
                console.table(this.mensajes)
            }
                                                                                                                                                                                                                                                                                                                                               
        }

    class Estudiante extends User {
        constructor(nombre, apellido, email) {
            super(nombre, apellido, email, "Estudiante"); // Definimos el rol automáticamente
        }
    }

    class Profesor extends User {
        constructor(nombre, apellido, email) {
            super(nombre, apellido, email, "Profesor");
        }
    }

// 1. Creación de Objetos (Instancias)
const alumno = new Estudiante("Carlos", "Sánchez", "carlos@test.com");
const profesor = new Profesor("Ana", "Martínez", "ana@test.com");

console.log("--- 🧪 TEST 1: Creación de Usuarios ---");
console.log(alumno);
console.log(profesor);

// 2. Probar addCurso (Agregar Cursos)
console.log("\n--- 🧪 TEST 2: Gestión de Cursos ---");
alumno.addCurso("JavaScript", "Inicial");
alumno.addCurso("React", "Intermedio");
// Intentar agregar un duplicado (debería dar error en consola)
alumno.addCurso("JavaScript", "Inicial"); 

// 3. Probar editCurso (Editar Nivel)
console.log("\n--- 🧪 TEST 3: Editar Curso ---");
// Cambiamos el nivel de JavaScript de 'Inicial' a 'Avanzado'
alumno.editCurso("JavaScript", "Avanzado");
console.log("Cursos de Carlos tras editar:", alumno.cursos);

// 4. Probar enviarMsg y mostrarMensajes
console.log("\n--- 🧪 TEST 4: Mensajería ---");
const confirmacion = profesor.enviarMsg(
    profesor.nombre, 
    alumno.nombre, 
    "Bienvenido al curso de JS"
);
console.log(confirmacion);

profesor.enviarMsg("Sistema", profesor.nombre, "Tienes un nuevo examen pendiente");
profesor.mostrarMensajes(); // Debería mostrar una tabla con 2 mensajes

// 5. Probar removeCurso (Eliminar)
console.log("\n--- 🧪 TEST 5: Eliminar Curso ---");
alumno.removeCurso("React", "Intermedio");
console.log("Cursos de Carlos tras eliminar React:", alumno.cursos);

// Intentar eliminar algo que no existe
alumno.removeCurso("Cocina", "Básico");


profesor.mostrarMensajes(); // Debería mostrar los mensajes del alumno (si tiene alguno)
    </script>
</body>
</html>
