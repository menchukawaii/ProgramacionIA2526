<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        const user = {
            "username": "carmen",
            "passwd": "1234",
            login: function(u, p){
                if (u == this.username & p == this.passwd){
                    alert("User confirmed")
                }
                else{
                    alert("User not found")
                } 
            }
        }
    
        window.onload = function(){
            let username = prompt("Introduce el username");
            let passwd = prompt("Introduce la contraseña");

            user.login(username, passwd);
        };
    </script>
</body>
</html>
