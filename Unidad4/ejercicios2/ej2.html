<script>
    const followers = new Set();
    
    function addFollower() {
        let username = document.getElementById("username").value.trim();
        if (followers.has(username)) {
            alert("El seguidor " + username + " ya está en la lista.");
        } else {
            followers.add(username);
            alert("Seguidor añadido.");
        }
    }

    function removeFollower() {
        let username = document.getElementById("username").value.trim();
        if (followers.has(username)) {
            followers.delete(username);
            alert("Seguidor eliminado.");
        } else {
            alert("El seguidor " + username + " no está en la lista.");
        }
    }

    function showFollowers() {
        const followerList = document.getElementById("followerList");
        followerList.innerHTML = "";
        followers.forEach(follower => {
            const li = document.createElement("li");
            li.textContent = follower;
            followerList.appendChild(li);
        });
    }

    function searchFollower() {
        let username = document.getElementById("username").value.trim();
        if (followers.has(username)) {
            alert("El seguidor " + username + " está en la lista.");
        } else {
            alert("El seguidor " + username + " no está en la lista.");
        }
    }

    function exit() {
        alert("Saliendo del sistema.");
    }
</script>
