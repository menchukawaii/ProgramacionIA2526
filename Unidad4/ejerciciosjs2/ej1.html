<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="button" value="JUGUEMOS" onclick="jugar()">
</body>
<script>
    function jugar() {
        alert("¡A jugar!");

        num = Math.floor(Math.random() * 100) + 1;
        console.log(num)
        for (let i = 0; i < 5; i++) {
            let input = prompt("Introduce un número:");
            if(num == input){
                alert("¡Has acertado!");
                return;
            } else if (num > input) {
                alert("El número es mayor que " + input);
            } else {
                alert("El número es menor que " + input);
            }
        }
    }
</script>
</html>
