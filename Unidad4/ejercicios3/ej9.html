<script>
    function lanzarDados(numVeces){
        let mayor = 1
        let dado;
        for (let i = 0; i < numVeces; i++) {
            dado = lanzar()
            (mayor < dado) ? mayor = dado : mayor
        }
        return mayor
    }

    function lanzar(){
        return Math.floor(Math.random()*6) + 1
    }

    console.log(lanzarDados(6))
</script>
