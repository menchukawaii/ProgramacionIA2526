<script>
    let arr = []
    function f(){
        for (let i = 0; i < 10; i++) {
            arr[i] = Math.floor(Math.random()*101)
        }
        arr.sort((a,b) => {

            const aTerminaEn0 = a % 10 === 0;
            const bTerminaEn0 = b % 10 === 0;

            if (aTerminaEn0 && !bTerminaEn0) return -1; // a va primero
            if (!aTerminaEn0 && bTerminaEn0) return 1;  // b va primero
            return 0; // Mantener orden relativo si ambos terminan en 0 o ninguno
        })
    }
</script>
